name: Build Plugin Zip

on:
  push:
    branches: [fix/paint-read-lock]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gradle-intellij-plugin 1.3.1 + IDEA 2020.1 SDK 时代的组合：JDK 11 + Gradle 7.2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.2'

      - name: Build plugin
        env:
          GRADLE_OPTS: -Xmx2g -Dfile.encoding=UTF-8
        run: gradle buildPlugin --no-daemon --stacktrace

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: show-comment-plugin
          path: build/distributions/*.zip
          if-no-files-found: error
